<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aurono Reports</title>

<style>
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Helvetica, Arial;
    background: #0a0f1f;
    color: #e5e7eb;
    padding: 24px;
    line-height: 1.4;
  }

  h1, h2 {
    color: #facc15;
    margin-bottom: 12px;
  }

  .top-links {
    margin-bottom: 22px;
  }

  .top-links a {
    color: #facc15;
    margin-right: 20px;
    font-weight: 600;
    text-decoration: none;
  }

  .section {
    margin-bottom: 40px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }

  th {
    text-align: left;
    padding: 8px;
    border-bottom: 1px solid rgba(148,163,184,0.35);
    color: #fbbf24;
    font-weight: 600;
  }

  td {
    padding: 8px;
    border-bottom: 1px solid rgba(148,163,184,0.2);
  }

  a {
    color: #fbbf24;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }
</style>
</head>

<body>

  <div class="top-links">
    <a href="/">← Back to Dashboard</a>
  </div>

  <h1>Aurono Reports</h1>

  <!-- DAILY REPORTS -->
  <div class="section">
    <h2>Daily Reports</h2>
    <table>
      <tr>
        <th>File</th>
        <th>View</th>
        <th>JSON</th>
      </tr>

      {% for f in daily_reports %}
      <tr>
        <td>{{ f }}</td>

        <!-- Safe, robust filename conversion -->
        <td><a href="/reports/view/{{ f.replace('.json', '.html') }}">View</a></td>

        <td><a href="/reports/download/daily/{{ f }}">Download JSON</a></td>
      </tr>
      {% endfor %}
    </table>
  </div>

  <!-- WEEKLY REPORTS -->
  <div class="section">
    <h2>Weekly Reports</h2>
    <table>
      <tr>
        <th>File</th>
        <th>View</th>
        <th>JSON</th>
      </tr>

      {% for f in weekly_reports %}
      <tr>
        <td>{{ f }}</td>

        <!-- Safe, robust filename conversion -->
        <td><a href="/reports/view/{{ f.replace('.json', '.html') }}">View</a></td>

        <td><a href="/reports/download/weekly/{{ f }}">Download JSON</a></td>
      </tr>
      {% endfor %}
    </table>
  </div>

</body>
</html>
