<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Report Viewer</title>

<style>
  :root {
    --bg: #0a0f1f;
    --nav-bg: #020617;
    --border: rgba(148,163,184,0.3);
    --gold: #facc15;
    --text: #e5e7eb;
  }

  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: system-ui, sans-serif;
    color: var(--text);
  }

  .topbar {
    background: var(--nav-bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    gap: 20px;
  }

  .topbar a {
    color: var(--gold);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
  }

  iframe {
    width: 100%;
    height: calc(100vh - 60px);
    border: none;
    background: #ffffff;
  }
</style>
</head>

<body>

  <div class="topbar">
    <a href="/">Dashboard</a>
    <a href="/reports">Reports</a>
  </div>

  <!-- Safe fallback -->
  <iframe src="{{ html_file or '' }}"></iframe>

</body>
</html>
