<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aurono Settings</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;margin:24px;}
.card{border:1px solid #ddd;border-radius:12px;padding:16px;max-width:520px;margin-bottom:20px;}
label{display:block;margin-top:10px;font-weight:500;}
input[type=text], select{width:100%;padding:6px;margin-top:4px;}
.btn{padding:8px 14px;border-radius:8px;border:1px solid #444;background:#f7f7f7;cursor:pointer;text-decoration:none;color:#111;}
.btn:hover{background:#eee;}
.hint{font-size:12px;color:#666;margin-top:4px;}
</style>
</head>
<body>
  <h1>Account Settings</h1>
  <p>
    <a class="btn" href="/">Dashboard</a>
    <a class="btn" href="/strategies">Strategies</a>
    <a class="btn" href="/activity">Activity</a>
    <a class="btn" href="/settings">Settings</a>
  </p>

  <div class="card">
    <h3>Exchange & API Credentials</h3>
    <form method="post" action="/settings/save">
      <label for="exchange">Exchange:</label>
      <select id="exchange" name="exchange">
        <option value="kraken" {% if cfg.exchange == 'kraken' %}selected{% endif %}>Kraken</option>
        <option value="bitvavo" {% if cfg.exchange == 'bitvavo' %}selected{% endif %}>Bitvavo</option>
      </select>
      <div class="hint">
        Choose your exchange. Aurono will send orders to the selected exchange only.
      </div>

      <label for="api_key">API Key:</label>
      <input type="text" id="api_key" name="api_key" value="{{ creds.api_key }}" required>

      <label for="api_secret">API Secret:</label>
      <input type="text" id="api_secret" name="api_secret" value="{{ creds.api_secret }}" required>

      <div class="hint">
        Keys are stored locally on your Aurono device in a JSON file referenced by config.yaml (<code>api_credentials</code>).
      </div>

      <div style="margin-top:15px;">
        <button class="btn" type="submit">Save</button>
        <a class="btn" href="/">Back</a>
      </div>
    </form>
  </div>
</body>
</html>
